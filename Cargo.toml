[package]
name = "nfcoffee"
version = "0.1.0"
edition = "2021"
description = "Portable TUI manager for the NFC_SD_WIFI coffee reader (replaces the Android NFCaffe app)"
license = "MIT"

[[bin]]
name = "nfcoffee"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
